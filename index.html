<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#e8642c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="€iclo">
<meta name="robots" content="noindex,nofollow">
<title>€iclo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1d1b18;--muted:#6f6a62;--line:#e7e3dc;--soft:#f1eee8;
  --accent:#e8642c;--accent-ink:#ffffff;--accent-soft:#fde8dd;
  --red:#c2410c;--red-soft:#fdecea;--green:#15803d;--green-soft:#e3f4e8;--amber:#b45309;--amber-soft:#fdf1dc;
  --blue:#1d4ed8;--blue-soft:#e4ebfd;--grey-soft:#efefef;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312;--panel:#1d1c1a;--ink:#f1eee9;--muted:#a39d93;--line:#2e2c29;--soft:#252421;
  --accent:#f07a45;--accent-soft:#3a2418;--red:#f87171;--red-soft:#3a1d1d;--green:#4ade80;--green-soft:#163222;
  --amber:#fbbf24;--amber-soft:#3a2e14;--blue:#93b4fd;--blue-soft:#1b2540;--grey-soft:#2a2927;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 8px 18px}
.brand .logo{width:34px;height:34px}
nav.side button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--muted);display:flex;gap:10px;align-items:center;font-weight:500}
nav.side button:hover{background:var(--soft);color:var(--ink)}
nav.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
nav.side .grow{flex:1}
.save-state{font-size:12px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--line);margin-top:8px;line-height:1.4}
.save-state b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
main{padding:26px 32px 90px;max-width:1240px;width:100%}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-bottom:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:9px;font-weight:550;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
select,input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:550;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.period{font-size:18px;font-weight:650;min-width:170px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.card .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card .val{font-size:21px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.card .hint{font-size:12px;color:var(--muted);margin-top:2px}
.card.hero{background:var(--accent);border-color:var(--accent);color:#fff}
.card.hero .lbl,.card.hero .hint{color:rgba(255,255,255,.85)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card.hero .bar{background:rgba(255,255,255,.25)}.card.hero .bar>i{background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel h2{font-size:15px;margin:0;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.panel h2 .tot{margin-left:auto;font-variant-numeric:tabular-nums}
.panel h2 .count{font-weight:500;color:var(--muted);font-size:12px}
.list{max-height:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 104px;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .d{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12px;color:var(--muted)}
.row .v{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}
.row.paus{opacity:.55}.row.paus .d{text-decoration:line-through}
.v.in{color:var(--green)}
.chip{font-size:11.5px;font-weight:650;padding:3px 8px;border-radius:99px;white-space:nowrap}
.row .chip{justify-self:center;min-width:78px;text-align:center}
.chip.pago{background:var(--green-soft);color:var(--green)}
.chip.pend{background:var(--amber-soft);color:var(--amber)}
.chip.paus{background:var(--grey-soft);color:var(--muted)}
.chip.rec{background:var(--green-soft);color:var(--green)}
.chip.sem{background:var(--red-soft);color:var(--red)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.panel .foot{padding:10px 16px;display:flex;gap:8px;border-top:1px solid var(--line);background:var(--soft)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.03em;background:var(--soft);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--accent-soft)}
tr.total td{font-weight:700;background:var(--soft)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
td.neg{color:var(--red)}td.pos{color:var(--green)}
.muted{color:var(--muted)}
.catbar{height:6px;background:var(--soft);border-radius:99px;min-width:80px}
.catbar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chart{padding:14px 16px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 16px 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;border:0;font-size:30px;cursor:pointer;box-shadow:0 8px 24px rgba(232,100,44,.4)}
.modal-bg{position:fixed;inset:0;background:rgba(10,8,6,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border-radius:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:18px 20px 6px;font-size:18px;font-weight:700;display:flex;align-items:center}
.modal header .x{margin-left:auto}
.modal .body{padding:10px 20px 6px;display:grid;gap:12px}
.modal .actions{padding:14px 20px 18px;display:flex;gap:8px;justify-content:flex-end}
.modal .actions .left{margin-right:auto}
.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigval{font-size:28px;font-weight:700;text-align:right;padding:10px 12px !important}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--blue-soft);color:var(--blue)}
.banner .btn{color:var(--ink)}
.settings{display:grid;gap:16px}
.settings .panel .body{padding:14px 16px;display:grid;gap:12px}
.inline-table input{width:110px;text-align:right;padding:6px 8px}
.inline-table input.wide{width:100%;text-align:left}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:40;padding:6px;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  nav.side .brand,nav.side .grow,.save-state{display:none}
  nav.side button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  main{padding:18px 14px 140px;overflow-x:hidden}
  .seg{max-width:100%;overflow-x:auto}
  .cards{grid-template-columns:1fr 1fr}
  .toolbar .muted{flex-basis:100%}
  .grid2{grid-template-columns:1fr}
  .fab{bottom:84px;right:18px}
}

.syncmini{display:none;font-size:12px;color:var(--muted);margin:-8px 0 14px}
@media (max-width:900px){.syncmini{display:block}}
.brand .logo{width:34px;height:34px;border-radius:9px}

@supports(padding:env(safe-area-inset-top)){main{padding-top:max(26px,env(safe-area-inset-top))}}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><img class="logo" alt="" src="icons/icon-192.png">€iclo</div>
    <button data-view="mensal">📅 <span>Mensal</span></button>
    <button data-view="anual">📊 <span>Anual</span></button>
    <button data-view="movimentos">🧾 <span>Movimentos</span></button>
    <button data-view="plano">💼 <span>Plano</span></button>
    <button data-view="definicoes">⚙️ <span>Definições</span></button>
    <div class="grow"></div>
    <div class="save-state" id="saveState"></div>
  </nav>
  <main><div class="syncmini" id="syncMini"></div><div id="main"></div></main>
</div>
<button class="fab" id="fab" title="Nova despesa (N)">+</button>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
